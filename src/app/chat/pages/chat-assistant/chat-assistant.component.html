<app-chat-slider
  [(visible)]="_sidebarVisible"
  [modal]="false"
  [position]="'right'"
  [styleClass]="'onecx-chat-sidebar p-0 w-full md:w-30rem lg:w-50rem'"
>
  @let vm = viewModel$ | async;
  @if (vm) {
    <div class="onecx-companion-container">
      @if (!vm.selectedChatMode && !vm.currentChat) {
        <app-chat-list-screen
          (selectMode)="selectChatMode($event)"
          (chatSelected)="chatSelected($event)"
          (deleteChat)="deleteChat($event)"
          [chats]="vm.chats ?? []"
        ></app-chat-list-screen>
      } @else {
        <div class="chat-interface" [@slideIn]>
          <app-chat-header
            [title]="(vm.settingsOpen ? 'CHAT.SETTINGS.TITLE'  : vm.chatTitleKey) | translate"
            [showBack]="true"
            [showClose]="vm.settingsOpen"
            [showSettings]="!vm.settingsOpen && vm.currentChat?.id !== 'new'"
            (backClicked)="vm.settingsOpen ? closeSettings() : goBack()"
            (settingsClicked)="openSettings()"
            (closed)="closeSidebar()"
          ></app-chat-header>
          @if (vm.settingsOpen) {
            <app-chat-settings
              [mode]="'edit'"
              [currentChat]="vm.currentChat"
              [settingsType]="vm.currentChat!.type"
              (submitted)="onSaveSettings($event)"
              (deleteChat)="deleteChat(vm.currentChat!)"
            ></app-chat-settings>
          } @else if (vm.currentChat?.id) {
            <app-chat
              [chatMessages]="vm.currentMessages ?? []"
              (sendMessage)="sendMessage($event)"
              (retrySendMessage)="sendMessage($event)"
            ></app-chat>
          }
        </div>
      }
    </div>
  }
</app-chat-slider>
<div class="layout-topbar-item">
  <p-button
    styleClass="chat-button p-button-rounded p-button-text"
    [attr.aria-label]="'CHAT.TITLE_AI' | translate"
    [pTooltip]="'CHAT.TITLE_AI' | translate"
    tooltipPosition="top"
    tooltipEvent="hover"
    (onClick)="sidebarVisible = true"
  >
    <i
      class="pi pi-comments fs-xlarge p-button-icon"
      style="background: transparent; border: none"
    ></i>
  </p-button>
</div>
