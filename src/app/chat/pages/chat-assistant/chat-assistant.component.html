<aside class="chat-panel" [attr.aria-label]="'CHAT.TITLE_AI' | translate" [class.chat-panel-open]="_sidebarVisible">
  @let vm = viewModel$ | async;
  @if (vm) {
    <div class="onecx-companion-container chat-panel-content flex flex-column min-w-0 min-h-0 overflow-hidden">
      @if (!vm.selectedChatMode && !vm.currentChat) {
        <app-chat-list-screen
          class="flex-1 min-h-0"
          (selectMode)="selectChatMode($event)"
          (chatSelected)="chatSelected($event)"
          (deleteChat)="deleteChat($event)"
          [chats]="vm.chats ?? []"
          [voiceChatStartError]="vm.voiceChatStartError"
        ></app-chat-list-screen>
      } @else {
        <div class="chat-interface flex-1 flex flex-column min-w-0 min-h-0 overflow-hidden" [@slideIn]>
          <app-chat-header
            [title]="(vm.settingsOpen ? 'CHAT.SETTINGS.TITLE' : vm.chatTitleKey) | translate"
            [showBack]="true"
            [showClose]="true"
            [showSettings]="!vm.voiceChatStartPending && !vm.settingsOpen && vm.currentChat?.id !== 'new'"
            [backLabelKey]="vm.settingsOpen ? 'CHAT.HEADER.BACK_TO_CHAT' : 'CHAT.HEADER.BACK_TO_CHATLIST'"
            (backClicked)="vm.settingsOpen ? closeSettings() : goBack()"
            (settingsClicked)="openSettings()"
            (closed)="closeSidebar()"
          ></app-chat-header>
          @if (vm.settingsOpen) {
            <app-chat-settings
              [mode]="'edit'"
              [currentChat]="vm.currentChat"
              [settingsType]="vm.currentChat!.type"
              (submitted)="onSaveSettings($event)"
              (deleteChat)="deleteChat(vm.currentChat!)"
            ></app-chat-settings>
          } @else if (vm.currentChat?.id) {
            <app-chat
              class="flex-1 min-w-0 min-h-0 overflow-hidden"
              [chatId]="vm.currentChat?.id"
              [chatMessages]="vm.currentMessages ?? []"
              [agents]="vm.agents"
              [selectedAgentId]="vm.selectedAgentId"
              [isAiChat]="vm.currentChat?.type === ChatType.AiChat"
              [showAgentSelector]="vm.showAgentSelector"
              [sendMessageDisabled]="vm.sendMessageDisabled"
              [voiceAiEnabled]="environment.voiceAiEnabled"
              [voiceChatEnabled]="vm.voiceChatEnabled"
              [voiceChatStartPending]="vm.voiceChatStartPending"
              [voiceChatStartError]="vm.voiceChatStartError"
              (sendMessage)="sendMessage($event)"
              (retrySendMessage)="sendMessage($event)"
              (agentSelected)="agentSelected($event)"
              (voiceChatStarted)="voiceChatStarted()"
              (voiceChatStopped)="voiceChatStopped()"
              (voiceChatPreparationStarted)="voiceChatPreparationStarted($event)"
              (voiceChatStartRequested)="voiceChatStartRequested($event)"
              (voiceChatStartFailed)="voiceChatStartFailed($event)"
              (userTranscript)="voiceUserTranscriptReceived($event)"
              (botTranscript)="voiceBotTranscriptReceived($event)"
            ></app-chat>
          }
        </div>
      }
    </div>
  }
</aside>
