<p-drawer
  [(visible)]="visible"
  [modal]="modal"
  [showCloseIcon]="showCloseIcon"
  [closeOnEscape]="closeOnEscape"
  [position]="position"
  [styleClass]="'fixed flex flex-column z-1' + ' top-0 right-0 h-full' + ' ' + styleClass"
  (onHide)="visibleChange.emit(false)"
>
  <ng-content></ng-content>
</p-drawer>
