<form [formGroup]="chatForm" (ngSubmit)="onSubmit()" class="new-chat-wrapper flex flex-column h-full bg-white p-3">
  <!-- Shared Settings (ALWAYS visible - used by all chat types) -->
  <app-shared-chat-settings [form]="chatForm"></app-shared-chat-settings>

  <!-- Type-Specific Settings (conditional based on chat mode) -->
  @if (settingsType === ChatType.HumanDirectChat) {
    <app-direct-chat-settings [form]="chatForm"></app-direct-chat-settings>
  }

  @if (settingsType === ChatType.HumanGroupChat) {
    <app-group-chat-settings [form]="chatForm"></app-group-chat-settings>
  }

  <!-- Spacer -->
  <div class="flex-grow-1"></div>

  <!-- Button Bar -->
  @if (mode === 'edit') {
    <div class="btn-bar flex justify-content-between align-items-center p-3">
      <p-button
        type="button"
        id="chat_settings_delete_button"
        [label]="'CHAT.ACTIONS.DELETE' | translate"
        [ariaLabel]="'CHAT.ACTIONS.DELETE' | translate"
        [pTooltip]="'CHAT.ACTIONS.DELETE' | translate"
        tooltipPosition="top"
        (onClick)="onDeleteChat()"
        (onKeydown)="onDeleteChatKeydown($any($event))"
      />
      <p-button
        type="submit"
        id="chat_settings_submit_button"
        [label]="'CHAT.ACTIONS.SAVE' | translate"
        [disabled]="chatForm.invalid"
        [ariaLabel]="'CHAT.HEADER.SAVE' | translate"
        [pTooltip]="'CHAT.HEADER.SAVE' | translate"
        tooltipPosition="top"
      />
    </div>
  } @else {
    <div class="btn-bar flex justify-content-end p-3">
      <p-button
        type="submit"
        id="chat_settings_submit_button"
        icon="pi pi-plus"
        data-testid="submit-chat-button"
        [label]="'CHAT.ACTIONS.CREATE' | translate"
        [disabled]="chatForm.invalid"
        [ariaLabel]="'CHAT.HEADER.CREATE' | translate"
        [pTooltip]="'CHAT.HEADER.CREATE' | translate"
        tooltipPosition="top"
      />
    </div>
  }
</form>
